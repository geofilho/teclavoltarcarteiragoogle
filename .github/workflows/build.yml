name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # O Android SDK já vem instalado no ubuntu-latest (ANDROID_HOME)

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk CarteiraRapidaG.apk

      - name: Guardar APK no build
        uses: actions/upload-artifact@v4
        with:
          name: CarteiraRapidaG
          path: CarteiraRapidaG.apk

      - name: Publicar na página de versões (sempre a mais recente)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima-versao
          name: Carteira Rápida G (última versão)
          body: "APK pronto para instalar no Galaxy Watch. Gerado automaticamente a partir do commit ${{ github.sha }}."
          files: CarteiraRapidaG.apk
          make_latest: true

      # Guarda também cada versão numa publicação própria (o link da última versão não muda).
      - name: Ler a versão
        id: v
        run: echo "nome=$(grep -ohP 'versionName\s*=\s*"\K[^"]+' app/build.gradle*)" >> "$GITHUB_OUTPUT"

      - name: Guardar esta versão (histórico)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Carteira Rápida G ${{ steps.v.outputs.nome }} (build ${{ github.run_number }})
          make_latest: false
          target_commitish: ${{ github.sha }}
          body: "Versão ${{ steps.v.outputs.nome }}, gerada do commit ${{ github.sha }}."
          files: CarteiraRapidaG.apk

      # A página de versões fica só com as duas últimas versões numeradas (build-N).
      # A publicação fixa "ultima-versao" não é apagada.
      - name: Manter só as duas últimas versões
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName -q '.[].tagName' |
          grep -E '^build-[0-9]' | sort -V -r | tail -n +3 |
          while read -r tag; do
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            echo "$tag apagada da página de versões"
          done

